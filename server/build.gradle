plugins {
    id 'java'
    id 'application'
}

group = 'com.sslauncher'
version = '1.0.0'

repositories {
    mavenCentral()
    // jvm-libp2p is published by the libp2p project on Cloudsmith (JitPack as fallback).
    maven { url = uri('https://dl.cloudsmith.io/public/libp2p/jvm-libp2p/maven/') }
    maven { url = uri('https://artifacts.consensys.net/public/maven/maven/') }
    maven { url = uri('https://jitpack.io') }
}

dependencies {
    implementation 'com.google.code.gson:gson:2.11.0'

    // The server only needs the TCP transport; optional native artefacts are
    // excluded so the distribution stays small and portable.
    implementation('io.libp2p:jvm-libp2p:1.3.8-RELEASE') {
        exclude group: 'io.netty', module: 'netty-codec-native-quic'
        exclude group: 'io.netty', module: 'netty-tcnative-boringssl-static'
        exclude group: 'io.netty', module: 'netty-transport-classes-epoll'
    }
    // jvm-libp2p declares these as runtime-scoped, but its public API exposes
    // Netty and Kotlin types, so they must be on the compile classpath too.
    implementation 'io.netty:netty-handler:4.2.18.Final'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.6.21'
    implementation 'org.slf4j:slf4j-simple:2.0.9'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    applicationName = 'sslauncher-bootstrap'
    mainClass = 'com.sslauncher.bootstrap.BootstrapServer'
    applicationDefaultJvmArgs = [
            '-Dfile.encoding=UTF-8',
            '-Dorg.slf4j.simpleLogger.defaultLogLevel=warn',
            '-Dorg.slf4j.simpleLogger.showDateTime=true'
    ]
}

distributions {
    main {
        distributionBaseName = 'sslauncher-bootstrap'
    }
}

tasks.named('distTar') {
    compression = Compression.GZIP
    archiveExtension = 'tar.gz'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('test') {
    useJUnitPlatform()
}
